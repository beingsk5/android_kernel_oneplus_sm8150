name: Build SM8150 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex cpio \
            libssl-dev libelf-dev \
            pahole python3 rsync \
            clang lld llvm

      - name: Show tool versions
        run: |
          clang --version | head -n 1
          ld.lld --version | head -n 1
          python3 --version

      - name: Build kernel Image + DTBs (sm8150_defconfig)
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          mkdir -p out
          make O=out vendor/sm8150_defconfig
          make O=out olddefconfig
          make -j"$(nproc)" O=out Image dtbs

      - name: Verify outputs
        run: |
          test -f out/arch/arm64/boot/Image
          find out/arch/arm64/boot/dts -type f -name '*.dtb' | head -n 5
          test "$(find out/arch/arm64/boot/dts -type f -name '*.dtb' | wc -l)" -gt 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm8150-kernel-image-and-dtbs
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error
